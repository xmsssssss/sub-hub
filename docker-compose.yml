services:
  sub-aggregator:
    build:
      context: .
      dockerfile: Dockerfile
    image: sub-aggregator:latest
    container_name: sub-aggregator
    restart: unless-stopped
    ports:
      - "3580:3580"
    environment:
      - PORT=3580
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
